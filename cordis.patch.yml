# dsh-mobile-bridge bundle patch.
#
# 只插入一行，不覆盖、不禁用任何既有行 —— 这是刻意的：
# 业务约束要求「不修改 DSH 源码，只用官方插件机制」，而本插件连宿主配置都不需要改。
# 原因见 README「零配置」一节：edge 反代会把 Host/Origin 改写成 loopback，
# 因此不需要 connection.trustedHosts，也不需要 web-runtime.publicUrl。
- insert:
    - id: dsh-mobile-bridge
      name: 'dsh-mobile-bridge'
      config:
        enabled: true
        # edge 监听端口（Tailscale serve 或局域网直连都指向它）。
        edgePort: 8787
        # 监听地址：默认只绑 loopback，靠 Tailscale serve 外出。
        # 想让局域网内手机直连（不装 Tailscale）就改成你本机的 LAN IP，例如 192.168.1.100。
        edgeHost: '127.0.0.1'
        # 留空 = 自动探测（先试 cloudflared 隧道，再试 tailscale，最后退回 LAN 地址）。
        # 装了 Tailscale 后可显式写成 https://<machine>.<tailnet>.ts.net
        publicBase: ''
        # 公网档通道：cloudflared 隧道。先 `winget install Cloudflare.cloudflared`，
        # 然后把 tunnelEnabled 改成 true，重启 Desktop 后 quick tunnel 地址
        # （https://<random>.trycloudflare.com）会自动出现在设置页与绑定地址二维码里。
        tunnelEnabled: true
        # 可选值：'sakura'|'token'|'quick'（默认 'quick'，sakura 需显式开启）。
        # quick = 零账号临时隧道（每次重启换地址）；token = 远程管理的命名隧道，
        # 需要填 tunnelToken 并显式写 publicBase（域名在 Cloudflare 后台配置）；
        # sakura = SakuraFrp 免费穿透（国内推荐），需填下面的 sakuraToken/sakuraTunnelId。
        tunnelMode: 'quick'
        tunnelToken: ''
        tunnelBin: 'C:/Program Files (x86)/cloudflared/cloudflared.exe'
        # 隧道传输协议：留空 = cloudflared 自选(QUIC)。
        # 本机装了 Cloudflare WARP 时，QUIC 会被 WARP 劫持导致 control stream 超时、
        # 隧道反复重启换地址（手机侧表现为 HTTP 530 发不出消息），此时填 http2 更稳。
        tunnelProtocol: 'http2'
        # 手机离线时审批先等一拍（SSE 重连通常在数秒内），到期仍无人再按来源分流。
        offlineGraceMs: 5000
        # SakuraFrp 免费穿透（国内推荐）：tunnelMode 设为 'sakura' 时启用，默认不启用。
        # 访问密钥与隧道 ID 属敏感信息，仅存本机 0600 文件，不要提交到仓库。
        sakuraToken: ''
        sakuraTunnelId: ''
        # frpc 可执行文件（从 https://www.natfrp.com/tunnel/download 下载）。
        sakuraBin: 'frpc'
        # 自定义域名；留空 = 自动识别 frpc 日志里的 >>host:port<< 或节点地址
        # （*.nyat.app / *.natfrp.cloud / frp-*.com|top），需 ≥0.51.0-sakura-14。
        sakuraDomain: ''
        # 任务结束态外部通知：每轮 turn/end 都推一条到已配置的外部推送通道
        # （完成/出错/中止/阻断/上限/中断/分叉全覆盖），默认开启；通知量大可关掉。
        taskNotifyEnabled: true
